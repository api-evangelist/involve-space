aid: involve-space
name: Involve Space
description: >-
  Involve Space is an Italian stratospheric aerospace company building
  real-time Earth intelligence. It operates autonomous high-altitude balloon
  platforms (Stratostats) that loiter around 20 kilometers for hours, days, or
  weeks to deliver continuous, high-resolution Earth observation, bridging the
  gap between satellites, drones, and ground sensors. Its Neurostar AI flight
  software autonomously controls individual balloons and networks of them
  (LoonHive), while the CLEAR GeoAI platform turns captured imagery into
  geospatial insights for disaster response, infrastructure and environmental
  monitoring, security, and in-orbit-demonstration / payload validation. A
  certified B Corporation headquartered in Italy with U.S. operations at the
  Houston Spaceport, Involve Space is backed by Earlybird Venture Capital,
  CDP Venture Capital, and an EIC Accelerator grant.
